    <!-- //  INTRO  // -->

        <div class="header-img">
            <div class="nav-container">
                <h3><a href="index.html">Virginia Scarlett</a></h3>

        <div class="content-wrapper">
            <h1>Projects</h1>
        </div>
    </header>

    <!--role "tablist" tells the screen reader that this container holds a group of tabs-->
    <main class="content-wrapper" role="tablist" aria-label="Portfolio Projects">
        <div class="project-button-grid">
            <button 
                class="btn"
                role="tab"
                id="tab-0"
                aria-controls="project-panel"
                aria-selected="false"
                data-project-id="0">
                OSPO Survey 2025
            </button>
            <button
                class="btn"
                role="tab"
                id="tab-1"
                aria-controls="project-panel"
                aria-selected="false"
                data-project-id="1">
                HPC Tutorial 2024
            </button>
            <button
                class="btn"
                role="tab"
                id="tab-2"
                aria-controls="project-panel"
                aria-selected="false"
                data-project-id="2">
                DIS Software 2024</button>
            <button
                class="btn"
                role="tab"
                id="tab-3"
                aria-controls="project-panel"
                aria-selected="false"
                data-project-id="3">
                Janelia Survey 2024
            </button>
            <button
                class="btn"
                role="tab"
                id="tab-4"
                aria-controls="project-panel"
                aria-selected="false"
                data-project-id="4">
                Plant Biology 2012-2022
            </button>
        </div>
        <!-- //  PROJECTS  // -->
        <div class="project-wrapper">
            <!--role "tabpanel" tells the screen reader this is the content area controlled by the tabs-->
            <div class="display-area" role="tabpanel" id="project-panel" aria-live="polite">
                <div class="starter-screen">
                    <h2>Click on a project to learn more!</h2>
                </div>
            </div>
        </div>
    </main>
